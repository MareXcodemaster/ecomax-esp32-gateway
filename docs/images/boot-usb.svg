<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1040" viewBox="0 0 780 1040" role="img" aria-labelledby="title desc">
 <title id="title">Puste ESP: przytrzymaj BOOT podczas podlaczania USB</title>
 <desc id="desc">Rysunek pogladowy Waveshare ESP32-S3-RS485-CAN i -U. BOOT to lewy z dwoch przyciskow obok diod, numer 13 na zdjeciu producenta. RESET ma numer 14. Odlacz cale zasilanie ESP, przytrzymaj BOOT, podlacz USB do komputera, po 2-3 sekundach zwolnij BOOT i wybierz port w instalatorze.</desc>
 <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#c62828"/></marker></defs>
 <rect width="780" height="1040" fill="#fff"/>
 <g font-family="Arial, sans-serif" fill="#243138">
  <text x="36" y="49" font-size="34" font-weight="700">USB nie wykrywa pustego ESP?</text>
  <text x="36" y="85" font-size="23">Waveshare ESP32-S3-RS485-CAN / -U</text>
  <text x="350" y="134" font-size="29" font-weight="700" fill="#c62828">BOOT</text>
  <text x="554" y="134" font-size="21" fill="#526168">RESET</text>
  <rect x="42" y="178" width="694" height="150" rx="5" fill="#176b80" stroke="#163d4d" stroke-width="2"/>
  <rect x="48" y="187" width="72" height="49" rx="3" fill="#71ad6b" stroke="#285b35" stroke-width="2"/>
  <circle cx="66" cy="211" r="10" fill="#c9d5cf" stroke="#687b73"/><path d="M59 218L73 204" stroke="#687b73" stroke-width="2"/>
  <circle cx="101" cy="211" r="10" fill="#c9d5cf" stroke="#687b73"/><path d="M94 218L108 204" stroke="#687b73" stroke-width="2"/>
  <rect x="29" y="264" width="79" height="46" rx="6" fill="#dce3e6" stroke="#526168" stroke-width="3"/>
  <rect x="29" y="274" width="17" height="26" rx="5" fill="#4b5860"/>
  <text x="117" y="298" font-size="22" fill="#fff">USB-C</text>
  <rect x="148" y="198" width="61" height="48" fill="#384854" stroke="#a4b9bd" stroke-width="2"/>
  <path d="M225 210H244M225 224H244M225 238H244M225 252H244M225 266H244M225 280H244M338 210H357M338 224H357M338 238H357M338 252H357M338 266H357M338 280H357" stroke="#d2dadb" stroke-width="5"/>
  <rect x="244" y="202" width="94" height="88" fill="#2c3943" stroke="#b2bec2" stroke-width="2"/>
  <text x="253" y="253" font-size="15" fill="#fff">ESP32-S3</text>
  <circle cx="387" cy="210" r="11" fill="#e85d52" stroke="#dce3e6" stroke-width="2"/>
  <circle cx="387" cy="252" r="11" fill="#f1f5f4" stroke="#dce3e6" stroke-width="2"/>
  <circle cx="387" cy="294" r="11" fill="#f1f5f4" stroke="#dce3e6" stroke-width="2"/>
  <rect x="432" y="184" width="40" height="26" rx="3" fill="#dce3e6" stroke="#26323a" stroke-width="2"/>
  <circle cx="452" cy="197" r="7" fill="#fff" stroke="#526168"/>
  <rect x="492" y="184" width="40" height="26" rx="3" fill="#dce3e6" stroke="#26323a" stroke-width="2"/>
  <circle cx="512" cy="197" r="7" fill="#fff" stroke="#526168"/>
  <text x="428" y="237" font-size="14" fill="#fff">BOOT</text>
  <text x="491" y="237" font-size="14" fill="#fff">RESET</text>
  <rect x="556" y="191" width="94" height="43" rx="2" fill="#26323a"/>
  <rect x="437" y="258" width="30" height="43" fill="#26323a"/>
  <rect x="493" y="258" width="30" height="43" fill="#26323a"/>
  <rect x="677" y="187" width="51" height="129" rx="3" fill="#71ad6b" stroke="#285b35" stroke-width="2"/>
  <g fill="#c9d5cf" stroke="#687b73"><circle cx="703" cy="205" r="10"/><circle cx="703" cy="236" r="10"/><circle cx="703" cy="267" r="10"/><circle cx="703" cy="298" r="10"/></g>
  <circle cx="452" cy="197" r="31" fill="none" stroke="#c62828" stroke-width="5"/>
  <path d="M400 143H452V161" fill="none" stroke="#c62828" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M576 141H512V180" fill="none" stroke="#526168" stroke-width="2"/>
  <text x="36" y="363" font-size="21">Widok pogl&#261;dowy p&#322;ytki od g&#243;ry, bez obudowy.</text>
  <text x="36" y="394" font-size="21">Na zdj&#281;ciu Waveshare: BOOT = 13, RESET = 14.</text>
  <path d="M36 419H744M36 538H744M36 657H744M36 776H744M36 895H744" stroke="#d7e1e3"/>
  <g fill="#176b67"><circle cx="60" cy="465" r="23"/><circle cx="60" cy="584" r="23"/><circle cx="60" cy="703" r="23"/><circle cx="60" cy="822" r="23"/></g>
  <g fill="#fff" text-anchor="middle" font-size="26" font-weight="700"><text x="60" y="474">1</text><text x="60" y="593">2</text><text x="60" y="712">3</text><text x="60" y="831">4</text></g>
  <g font-size="28" font-weight="700"><text x="104" y="465">Od&#322;&#261;cz zasilanie ESP.</text><text x="104" y="584">Przytrzymaj BOOT.</text><text x="104" y="703">Trzymaj BOOT i pod&#322;&#261;cz USB.</text><text x="104" y="822">Po 2-3 s pu&#347;&#263; BOOT.</text></g>
  <g font-size="24" fill="#526168"><text x="104" y="502">Wypnij USB i inne zasilanie modu&#322;u.</text><text x="104" y="621">BOOT, nie RESET. Nie zwieraj pin&#243;w.</text><text x="104" y="740">W&#322;&#243;&#380; kabel do portu komputera.</text><text x="104" y="859">Wybierz port ponownie w instalatorze.</text></g>
  <text x="36" y="937" font-size="23" font-weight="700">BOOT sam nie kasuje pami&#281;ci.</text>
  <text x="36" y="974" font-size="23">Podczas zapisu firmware nie od&#322;&#261;czaj USB.</text>
  <text x="36" y="1012" font-size="19" fill="#526168">Dost&#281;p do przycisku zale&#380;y od obudowy. Otwieraj j&#261; bez zasilania.</text>
 </g>
</svg>
