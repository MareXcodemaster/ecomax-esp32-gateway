<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-labelledby="title desc">
 <title id="title">Połączenie sygnałów RS485: A+ do D+, B- do D-</title>
 <desc id="desc">Schemat sygnałów, nie kolejność pinów złącza. ESP ma osobne zasilanie. W kotle trzeba potwierdzić oznaczenia magistrali panelu.</desc>
 <rect width="720" height="390" fill="#ffffff"/>
 <g font-family="Arial, sans-serif" fill="#253137" text-anchor="middle">
  <text x="360" y="38" font-size="25" font-weight="700">RS485: połączenie dwóch sygnałów</text>
  <text x="155" y="82" font-size="20" font-weight="700">Waveshare ESP32-S3</text>
  <text x="565" y="82" font-size="20" font-weight="700">ecoMAX860P-LZ TOUCH</text>
  <text x="155" y="106" font-size="14">RS485-CAN / RS485-CAN-U</text>
  <text x="565" y="106" font-size="16">ecoMAX860P4-LZ</text>
  <text x="155" y="132" font-size="18">Zaciski RS485</text>
  <text x="565" y="132" font-size="18">G4: magistrala panelu</text>
 </g>
 <rect x="38" y="144" width="234" height="146" rx="5" fill="#eef7f5" stroke="#a3c6bd" stroke-width="2"/>
 <rect x="448" y="144" width="234" height="146" rx="5" fill="#f0f5fb" stroke="#a9bed6" stroke-width="2"/>
 <path d="M248 184 H472" fill="none" stroke="#137e70" stroke-width="5"/>
 <path d="M248 248 H472" fill="none" stroke="#286aa8" stroke-width="5"/>
 <g fill="#137e70"><circle cx="248" cy="184" r="7"/><circle cx="472" cy="184" r="7"/></g>
 <g fill="#286aa8"><circle cx="248" cy="248" r="7"/><circle cx="472" cy="248" r="7"/></g>
 <g font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#253137">
  <text x="148" y="194">A+</text><text x="568" y="194">D+</text>
  <text x="148" y="258">B-</text><text x="568" y="258">D-</text>
 </g>
 <g font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#4d6069">
  <text x="360" y="325">Jedna skręcona para przewodów</text>
  <text x="360" y="358">To nie jest rozkład pinów wtyczki RJ.</text>
 </g>
</svg>
