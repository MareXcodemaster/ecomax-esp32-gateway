<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Kocio&#322;, mieszacz i ciep&#322;a woda</title>
<desc id="diagram-desc">Pogl&#261;dowy obieg grzewczy. Czerwone przewody: zasilanie, niebieskie: powr&#243;t. Warto&#347;ci z regulatora, zielona pompa oznacza prac&#281;.</desc>
<defs>
 <linearGradient id="metal"><stop stop-color="#d9e1e2"/><stop offset=".35" stop-color="#fff"/><stop offset="1" stop-color="#c6d1d3"/></linearGradient>
 <linearGradient id="boiler"><stop stop-color="#f9fbfb"/><stop offset="1" stop-color="#dbe4e4"/></linearGradient>
</defs>
<style>
 text{font-family:Arial,sans-serif;fill:#293a3b;font-size:16px;letter-spacing:0}
 .caption{font-size:14px;fill:#576b6c}.reading{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums}
 .hot{fill:none;stroke:#ce4b49;stroke-width:9;stroke-linejoin:round}.cold{fill:none;stroke:#3186ad;stroke-width:9;stroke-linejoin:round}
 .object{stroke:#6d8184;stroke-width:2}.pump circle{fill:#e6ebec;stroke:#697e81;stroke-width:2}.pump path{fill:#819295}
 .pump[data-state=on] circle{fill:#d8efdf;stroke:#277e4b}.pump[data-state=on] path{fill:#277e4b}
 .pump[data-state=unknown]{opacity:.6}.pump text{font-size:14px;text-anchor:middle}
</style>
<rect width="1000" height="680" fill="#fff"/>
<path d="M24 84H976" stroke="#dce4e3"/>
