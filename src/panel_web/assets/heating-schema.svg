<text x="350" y="35" class="caption">MOC</text><text x="350" y="65" class="reading" data-value="power">---</text>
<text x="570" y="35" class="caption">PELLET</text><text x="570" y="65" class="reading" data-value="fuel">---</text>
<text x="790" y="35" class="caption">WENTYLATOR</text><text x="790" y="65" class="reading" data-value="fan">---</text>
